name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (frontend)
        run: pnpm --filter @rewebportal/web exec tsc --noEmit

      - name: Build (frontend)
        run: pnpm --filter @rewebportal/web exec next build

      - name: Lint (frontend)
        run: pnpm --filter @rewebportal/web exec next lint || true
